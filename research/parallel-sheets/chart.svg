<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="720" viewBox="0 0 1020 720" role="img" aria-labelledby="title desc">
<title id="title">Complete ODS2TSV exports: private workload and fixed-work sheet scaling</title>
<desc id="desc">Private workload median elapsed times, and parallel speedups across sheet counts. Three measured rounds except five for 5000 sheets. All startup, indexing, parsing and ordered output included.</desc>
