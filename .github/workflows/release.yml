name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked release (false verifies builds only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  eligible:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - id: gate
        run: python scripts/release.py
        env:
          GH_TOKEN: ${{ github.token }}
  checks:
    needs: eligible
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    if: inputs.publish
    needs: [eligible, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - run: python scripts/release.py --publish
        env:
          GH_TOKEN: ${{ github.token }}
  verify-downloads:
    if: inputs.publish
    needs: [eligible, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Download published bytes and check the installed executable
        shell: bash
        run: |
          version="${{ needs.eligible.outputs.version }}"
          gh release download "$version" --repo "$GITHUB_REPOSITORY" --pattern "ods2tsv-${version}-${{ matrix.target }}.zip*" --dir downloaded
          python scripts/artifact.py downloaded/*.zip
        env:
          GH_TOKEN: ${{ github.token }}
